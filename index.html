<!DOCTYPE html>
<html>
<head>
<style>
#mask1 {
  -webkit-mask-image: url(badapple.png);
  mask-image: url(badapple.png);
  mask-repeat: no-repeat;    
}
</style>
</head>
<body>

<h1>The mask-image Property</h1>

<h3>An image with a mask layer image:</h3>
<div>
<img src="AA26ncnk.jpg"  width="600" height="400" id="mask1">
</div>

<h3>Original image:</h3>
<img src="AA26ncnk.jpg"  width="600" height="400">

</body>
</html>
