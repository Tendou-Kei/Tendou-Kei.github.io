<!DOCTYPE html>
<html>
<head>
<style>
#mask1 {

  -webkit-mask-image: url(badapple.png);
  mask-image: url(badapple.png);
  

  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;  
  
  -webkit-mask-size: 100% 100%;
  mask-size: 100% 100%;

}

img{
  max-width: 300px;
  max-height: 500px;
}
</style>
</head>
<body>

<div>
<img src="girl.jpg" id="mask1" >
</div>

<h3>Original image:</h3>
<img src="girl.jpg">


</body>
</html>
